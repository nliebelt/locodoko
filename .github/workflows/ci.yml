name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Backend-Tests ausführen
        run: mvn clean verify -Dskip.frontend=true

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Tests ausführen
        working-directory: frontend
        run: npm run test

      - name: Build ausführen
        working-directory: frontend
        run: npm run build

      - name: Lint ausführen
        working-directory: frontend
        run: npm run lint

      - name: Zirkuläre Importe prüfen (madge)
        working-directory: frontend
        run: npm run madge

      - name: Tote Exporte prüfen (knip)
        working-directory: frontend
        run: npm run knip

      - name: Komplexität prüfen (biome)
        working-directory: frontend
        run: npm run complexity

  spec-lint:
    name: Spec-Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spec-Lint ausführen
        run: python3 check_specs.py

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        working-directory: frontend
        run: npm ci && npm run build

      - name: Backend starten (im Hintergrund)
        run: |
          mvn spring-boot:run -Dskip.frontend=true \
            -Dspring-boot.run.jvmArguments="-Dspring.profiles.active=default" \
            > /tmp/backend.log 2>&1 &
          echo "Backend-PID: $!"

      - name: Warten bis Backend bereit
        run: |
          echo "Warte auf Backend (max. 90s)..."
          timeout 90 bash -c \
            'until curl -sf http://localhost:8081/api/tische > /dev/null; do sleep 2; done'
          echo "Backend bereit."

      - name: Frontend-Bundle in Backend-Static einfügen
        run: cp -r frontend/dist/* target/classes/static/

      - name: Playwright Chromium installieren
        working-directory: e2e
        run: npm ci && npx playwright install chromium --with-deps

      - name: E2E-Tests ausführen
        working-directory: e2e
        run: npx playwright test

      - name: Backend-Log bei Fehler ausgeben
        if: failure()
        run: tail -100 /tmp/backend.log || true

      - name: Playwright-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Vision-Loop-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-loop-screenshots
          path: e2e/screenshots/
          retention-days: 30
