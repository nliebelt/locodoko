name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Backend-Tests ausführen
        run: mvn clean verify -Dskip.frontend=true

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Tests ausführen
        working-directory: frontend
        run: npm run test

      - name: Build ausführen
        working-directory: frontend
        run: npm run build

      - name: Lint ausführen
        working-directory: frontend
        run: npm run lint
