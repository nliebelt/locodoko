name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Docs bauen (MkDocs Material)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: MkDocs Material + lizard installieren
        run: pip install mkdocs-material==9.5.49 lizard

      - name: Frontend-Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Metrik-Report generieren (metrics.sh)
        run: bash scripts/metrics.sh

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Docs bauen
        run: mkdocs build --strict

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Auf GitHub Pages deployen
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
