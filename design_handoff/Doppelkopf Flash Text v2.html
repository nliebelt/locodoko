<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doppelkopf – Flash Text Animations v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     oklch(14% 0.01 260);
  --bg2:    oklch(18% 0.012 260);
  --bg3:    oklch(22% 0.014 260);
  --border: oklch(28% 0.015 260);
  --text:   oklch(92% 0.005 260);
  --muted:  oklch(52% 0.01 260);
  --gold:   oklch(75% 0.16 75);
  --red:    oklch(60% 0.22 25);
  --blue:   oklch(65% 0.18 230);
  --green:  oklch(65% 0.18 145);
  --fox:    oklch(70% 0.20 50);
  --pink:   oklch(68% 0.20 340);
  --cyan:   oklch(72% 0.16 195);
  font-family: 'DM Sans', sans-serif;
}

html, body { width: 100%; min-height: 100vh; background: var(--bg); color: var(--text); overflow-x: hidden; }
#root { min-height: 100vh; }

/* ── Header ── */
.site-header {
  padding: 28px 36px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
}
.site-header-left { display: flex; align-items: baseline; gap: 14px; }
.site-header h1 {
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);
}
.site-header p { font-size: 12px; color: var(--muted); }
.event-count { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); }

/* ── Layout ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
}
.section-label {
  grid-column: 1 / -1;
  padding: 22px 24px 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted);
  font-family: 'Space Mono', monospace;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

/* ── Card ── */
.card { background: var(--bg2); display: flex; flex-direction: column; }

.card-header {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start;
}
.event-name {
  font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
  color: var(--muted); letter-spacing: 0.06em; margin-bottom: 4px;
}
.event-name span { color: var(--text); }
.card-title { font-size: 13px; font-weight: 600; color: var(--text); }
.card-desc { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.55; }
.badge {
  font-size: 9px; font-family: 'Space Mono', monospace; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
  color: var(--bg); font-weight: 700; white-space: nowrap; align-self: start;
}
.badge-gold  { background: var(--gold); }
.badge-red   { background: var(--red); }
.badge-blue  { background: var(--blue); }
.badge-green { background: var(--green); }
.badge-fox   { background: var(--fox); }
.badge-pink  { background: var(--pink); }
.badge-cyan  { background: var(--cyan); }

/* ── Stage ── */
.card-stage {
  height: 200px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); position: relative; overflow: hidden;
  cursor: pointer; user-select: none; flex-shrink: 0;
}
.card-stage:hover .play-hint { opacity: 1; }
.play-hint {
  position: absolute; bottom: 9px; right: 11px;
  font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace;
  opacity: 0; transition: opacity 0.2s; pointer-events: none;
}

/* ── Payload chip ── */
.payload-row {
  padding: 8px 18px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 6px; flex-wrap: wrap;
}
.payload-chip {
  font-family: 'Space Mono', monospace; font-size: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--muted); padding: 2px 8px; border-radius: 3px;
}
.payload-chip b { color: var(--text); font-weight: 700; }

/* ── Code ── */
.code-block {
  background: var(--bg3); border: none;
  padding: 14px 16px; font-family: 'Space Mono', monospace;
  font-size: 10px; color: oklch(70% 0.07 260); line-height: 1.75;
  overflow-x: auto; white-space: pre; flex: 1;
}
.ck { color: oklch(65% 0.18 290); }   /* keyword */
.cs { color: var(--green); }           /* string */
.cn { color: var(--fox); }             /* number */
.cf { color: var(--gold); }            /* function */
.cc { color: var(--muted); }           /* comment */
.ce { color: var(--cyan); }            /* event name */

/* ── Flash text base ── */
.ft {
  font-family: 'Black Han Sans', sans-serif; text-align: center;
  line-height: 1.1; position: relative; z-index: 2;
  -webkit-font-smoothing: antialiased;
}
.ft-xl { font-size: 62px; }
.ft-lg { font-size: 50px; }
.ft-md { font-size: 38px; }
.ft-sm { font-size: 26px; }
.ft-sub {
  font-family: 'Space Mono', monospace; font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 5px;
  opacity: 0.65; text-align: center;
}

/* ── Keyframes ── */
@keyframes kScalePunch {
  0%   { transform: scale(0.05) rotate(-4deg); opacity: 0; }
  55%  { transform: scale(1.18) rotate(1.5deg); opacity: 1; }
  72%  { transform: scale(0.94) rotate(-0.5deg); }
  88%  { transform: scale(1.04); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes kChroma {
  0%   { transform: scale(0.3); opacity: 0; filter: blur(14px) brightness(4); }
  18%  { transform: scale(1.28); opacity: 1; filter: blur(0) brightness(4.5); }
  40%  { transform: scale(0.96); filter: brightness(1.4); }
  100% { transform: scale(1); opacity: 1; filter: brightness(1); }
}
@keyframes kStamp {
  0%   { transform: translateY(-70px) scale(1.35); opacity: 0; }
  58%  { transform: translateY(5px) scale(0.98); opacity: 1; }
  78%  { transform: translateY(-2px) scale(1.01); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes kScoreUp {
  0%   { transform: translateY(28px) scale(0.65); opacity: 0; }
  42%  { transform: translateY(-6px) scale(1.1); opacity: 1; }
  68%  { transform: translateY(2px) scale(0.99); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes kNeonIn {
  0%   { opacity: 0; letter-spacing: -0.08em; filter: blur(10px); }
  55%  { opacity: 1; letter-spacing: 0.02em; filter: blur(1px); }
  100% { opacity: 1; letter-spacing: 0.04em; filter: blur(0); }
}
@keyframes kNeonPulse {
  0%,100% { text-shadow: 0 0 8px currentColor, 0 0 22px currentColor, 0 0 44px currentColor; }
  50%      { text-shadow: 0 0 4px currentColor, 0 0 10px currentColor; }
}
@keyframes kGlitchIn {
  0%   { transform: scale(0.8) skewX(8deg); opacity: 0; filter: brightness(8) hue-rotate(90deg); }
  20%  { transform: scale(1.1) skewX(-3deg); opacity: 1; filter: brightness(3); }
  45%  { transform: scale(0.97) skewX(0.5deg); }
  100% { transform: scale(1); opacity: 1; filter: brightness(1); }
}
@keyframes kGlitch {
  0%,100% { clip-path: none; transform: none; }
  8%  { clip-path: polygon(0 8%, 100% 8%, 100% 42%, 0 42%); transform: translateX(-5px); }
  10% { clip-path: polygon(0 58%, 100% 58%, 100% 88%, 0 88%); transform: translateX(5px); }
  12% { clip-path: none; transform: none; }
  28% { clip-path: polygon(0 25%, 100% 25%, 100% 48%, 0 48%); transform: translateX(3px); }
  30% { clip-path: none; }
}
@keyframes kZoomBlur {
  0%   { transform: scale(4.5); opacity: 0; filter: blur(22px); }
  48%  { transform: scale(0.94); opacity: 1; filter: blur(0); }
  70%  { transform: scale(1.03); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes kShockRing {
  0%   { transform: scale(0.15); opacity: 0.85; }
  100% { transform: scale(4); opacity: 0; }
}
@keyframes kBounceIn {
  0%   { transform: scale(0) rotate(20deg); opacity: 0; }
  50%  { transform: scale(1.2) rotate(-6deg); opacity: 1; }
  70%  { transform: scale(0.93) rotate(2deg); }
  85%  { transform: scale(1.05) rotate(-1deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes kSlideRight {
  0%   { transform: translateX(-60px); opacity: 0; }
  55%  { transform: translateX(5px); opacity: 1; }
  80%  { transform: translateX(-2px); }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes kPigWobble {
  0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
  45%  { transform: scale(1.25) rotate(8deg); opacity: 1; }
  65%  { transform: scale(0.9) rotate(-4deg); }
  80%  { transform: scale(1.08) rotate(2deg); }
  92%  { transform: scale(0.97) rotate(-1deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.a-scalePunch { animation: kScalePunch 0.52s cubic-bezier(0.22,1,0.36,1) forwards; }
.a-chroma     { animation: kChroma 0.58s ease-out forwards; }
.a-stamp      { animation: kStamp 0.44s cubic-bezier(0.34,1.56,0.64,1) forwards; }
.a-scoreUp    { animation: kScoreUp 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
.a-neon       { animation: kNeonIn 0.5s ease-out forwards, kNeonPulse 1.4s 0.5s ease-in-out infinite; }
.a-glitch     { animation: kGlitchIn 0.5s ease-out forwards, kGlitch 2.2s 0.5s infinite; }
.a-zoomBlur   { animation: kZoomBlur 0.52s cubic-bezier(0.16,1,0.3,1) forwards; }
.a-bounceIn   { animation: kBounceIn 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }
.a-slideRight { animation: kSlideRight 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
.a-pigWobble  { animation: kPigWobble 0.65s cubic-bezier(0.22,1,0.36,1) forwards; }

.shock-ring {
  position: absolute; width: 80px; height: 80px; border-radius: 50%;
  border: 3px solid currentColor; pointer-events: none;
  left: 50%; top: 50%; margin-left: -40px; margin-top: -40px;
}
.shock-ring.go { animation: kShockRing 0.6s ease-out forwards; }

/* fox letter drop */
.fox-letter {
  display: inline-block; opacity: 0;
  transform: translateY(-35px) rotate(-18deg);
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s;
}
.fox-letter.drop { opacity: 1; transform: translateY(0) rotate(0deg); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── helpers ── */
function useReplay() {
  const [key, setKey] = useState(0);
  const replay = useCallback(() => setKey(k => k + 1), []);
  return [key, replay];
}

function ShockRings({ trigger, color }) {
  const [rings, setRings] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const id = Date.now();
    setRings(r => [...r, id]);
    setTimeout(() => setRings(r => r.filter(x => x !== id)), 700);
  }, [trigger]);
  return <>{rings.map(id => <div key={id} className="shock-ring go" style={{ color }} />)}</>;
}

function Confetti({ trigger, c1, c2 }) {
  const ref = useRef(null);
  const raf = useRef(null);
  useEffect(() => {
    if (!trigger) return;
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth;
    const H = canvas.height = canvas.offsetHeight;
    const pts = Array.from({ length: 55 }, () => ({
      x: W/2 + (Math.random()-0.5)*50, y: H/2,
      vx: (Math.random()-0.5)*13, vy: -(Math.random()*10+5),
      size: Math.random()*7+3, color: Math.random()>0.5 ? c1 : c2,
      rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.32, a: 1,
    }));
    let f = 0;
    const draw = () => {
      ctx.clearRect(0,0,W,H);
      pts.forEach(p => {
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.42;
        p.rot+=p.rotV; p.a-=0.017;
        if (p.a<=0) return;
        ctx.save(); ctx.globalAlpha=p.a;
        ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.48);
        ctx.restore();
      });
      if (++f < 120) raf.current = requestAnimationFrame(draw);
    };
    cancelAnimationFrame(raf.current); draw();
    return () => cancelAnimationFrame(raf.current);
  }, [trigger]);
  return <canvas ref={ref} style={{ position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none' }} />;
}

function Code({ children }) {
  return <pre className="code-block" dangerouslySetInnerHTML={{ __html: children }} />;
}

function PayloadChip({ field, sample }) {
  return <span className="payload-chip"><b>{field}</b>{sample ? `: ${sample}` : ''}</span>;
}

/* ── Card wrapper ── */
function Card({ eventName, title, badge, badgeClass, desc, payload, stage, code }) {
  return (
    <div className="card">
      <div className="card-header">
        <div>
          <div className="event-name"><span>{eventName}</span></div>
          <div className="card-title">{title}</div>
          <div className="card-desc">{desc}</div>
        </div>
        <span className={`badge badge-${badgeClass}`}>{badge}</span>
      </div>
      {payload && (
        <div className="payload-row">
          {payload.map((p,i) => <PayloadChip key={i} field={p.field} sample={p.sample} />)}
        </div>
      )}
      {stage}
      <Code>{code}</Code>
    </div>
  );
}

/* ══════════════════════════════════════
   STAGES
══════════════════════════════════════ */

/* SpielGestartet — Slide Right */
function StageSpielGestartet({ speed }) {
  const [key, replay] = useReplay();
  const d = (400/speed).toFixed(0)+'ms';
  return (
    <div className="card-stage" onClick={replay}>
      {key>0 && <div key={key} className="ft ft-lg a-slideRight" style={{ color:'var(--cyan)', animationDuration:d }}>
        SPIEL STARTET
        <div className="ft-sub" style={{color:'var(--cyan)'}}>Tisch bereit</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ wiederholen</div>
    </div>
  );
}

/* SpielBeendet — Zoom Blur + Konfetti */
function StageSpielBeendet({ speed }) {
  const [key, replay] = useReplay();
  const d = (520/speed).toFixed(0)+'ms';
  return (
    <div className="card-stage" onClick={replay} style={{background:'oklch(9% 0.04 145)'}}>
      <Confetti trigger={key} c1="var(--green)" c2="var(--gold)" />
      {key>0 && <div key={key} style={{textAlign:'center',zIndex:2}}>
        <div className="ft ft-xl a-zoomBlur" style={{color:'var(--green)',animationDuration:d}}>GEWONNEN</div>
        <div className="ft ft-sm a-stamp" style={{color:'var(--gold)',opacity:0,animationDelay:'100ms',animationFillMode:'forwards',animationDuration:(parseInt(d)+60)+'ms'}}>Spiel beendet · Re +4</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ wiederholen</div>
    </div>
  );
}

/* StichAbgeschlossen — Score Fly-Up */
function StageStich({ speed }) {
  const [key, replay] = useReplay();
  const [vals] = useState(['+1','+2','+3']);
  const [i, setI] = useState(0);
  const d = (380/speed).toFixed(0)+'ms';
  const go = () => { setI(v => (v+1)%vals.length); replay(); };
  return (
    <div className="card-stage" onClick={go}>
      {key>0 && <div key={key} style={{textAlign:'center',zIndex:2}}>
        <div className="ft ft-xl a-scoreUp" style={{color:'var(--green)',animationDuration:d}}>{vals[i]}</div>
        <div className="ft-sub" style={{color:'var(--green)',marginTop:4}}>Stich gewonnen</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ klicken · Wert wechselt</div>
    </div>
  );
}

/* VorbehaltErwartet — Neon Blink */
function StageVorbehalt({ speed }) {
  const [key, replay] = useReplay();
  const d = (480/speed).toFixed(0)+'ms';
  return (
    <div className="card-stage" onClick={replay} style={{background:'oklch(8% 0.03 260)'}}>
      {key>0 && <div key={key} className="ft ft-md a-neon" style={{color:'var(--blue)',animationDuration:d}}>
        VORBEHALT?
        <div className="ft-sub" style={{color:'var(--blue)'}}>Spieler am Zug</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ wiederholen</div>
    </div>
  );
}

/* SchweinchenGemeldet — Pig Wobble */
function StageSchweinchen({ speed }) {
  const [key, replay] = useReplay();
  const d = (650/speed).toFixed(0)+'ms';
  return (
    <div className="card-stage" onClick={replay} style={{background:'oklch(9% 0.04 340)'}}>
      <ShockRings trigger={key} color="var(--pink)" />
      {key>0 && <div key={key} style={{textAlign:'center',zIndex:2}}>
        <div className="ft ft-xl a-pigWobble" style={{color:'var(--pink)',animationDuration:d}}>🐷</div>
        <div className="ft ft-sm a-stamp" style={{color:'var(--pink)',opacity:0,animationFillMode:'forwards',animationDelay:'120ms',animationDuration:(parseInt(d)-100)+'ms'}}>
          Schweinchen!
        </div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ wiederholen</div>
    </div>
  );
}

/* FuchsGefangen — Stamp + Letter Drop + Konfetti */
function StageFuchs({ speed }) {
  const [key, replay] = useReplay();
  const word = 'FUCHS';
  const delay = Math.round(75/speed);
  return (
    <div className="card-stage" onClick={replay} style={{background:'oklch(9% 0.05 50)'}}>
      <Confetti trigger={key} c1="var(--fox)" c2="#fff" />
      {key>0 && <div key={key} style={{textAlign:'center',zIndex:2}}>
        <div style={{fontFamily:"'Black Han Sans',sans-serif",fontSize:58,color:'var(--fox)'}}>
          {word.split('').map((ch,i)=><FoxLetter key={i} ch={ch} delay={i*delay} />)}
        </div>
        <div className="ft-sub" style={{color:'var(--fox)',marginTop:6}}>gefangen · +1 Punkt</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ wiederholen</div>
    </div>
  );
}

function FoxLetter({ch, delay}) {
  const ref = useRef(null);
  useEffect(() => {
    const t = setTimeout(() => ref.current?.classList.add('drop'), delay);
    return () => clearTimeout(t);
  }, [delay]);
  return <span ref={ref} className="fox-letter">{ch}</span>;
}

/* KarlchenGespielt — Bounce In */
function StageKarlchen({ speed }) {
  const [key, replay] = useReplay();
  const d = (560/speed).toFixed(0)+'ms';
  return (
    <div className="card-stage" onClick={replay} style={{background:'oklch(8% 0.04 75)'}}>
      <ShockRings trigger={key} color="var(--gold)" />
      {key>0 && <div key={key} style={{textAlign:'center',zIndex:2}}>
        <div className="ft ft-xl a-bounceIn" style={{color:'var(--gold)',animationDuration:d}}>
          KARLCHEN
        </div>
        <div className="ft-sub" style={{color:'var(--gold)',marginTop:5}}>letzter Stich · +1</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ wiederholen</div>
    </div>
  );
}

/* DoppelkopfGestochen — Chroma Flash (biggest moment) */
function StageDoppelkopf({ speed }) {
  const [key, replay] = useReplay();
  const d = (580/speed).toFixed(0)+'ms';
  return (
    <div className="card-stage" onClick={replay} style={{background:'oklch(8% 0.05 75)'}}>
      <Confetti trigger={key} c1="var(--gold)" c2="var(--fox)" />
      <ShockRings trigger={key} color="var(--gold)" />
      {key>0 && <div key={key} style={{textAlign:'center',zIndex:2}}>
        <div className="ft ft-xl a-chroma" style={{
          color:'var(--gold)',
          textShadow:'0 0 40px var(--gold)',
          animationDuration:d
        }}>
          DOPPEL<br/>KOPF
        </div>
        <div className="ft-sub" style={{color:'var(--gold)',marginTop:4}}>gestochen · +2</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ wiederholen</div>
    </div>
  );
}

/* NaechsterSpielerErwartet — Scale Punch leicht */
function StageNaechster({ speed }) {
  const [key, replay] = useReplay();
  const [players] = useState(['Spieler 1','Spieler 2','Spieler 3','Spieler 4']);
  const [i, setI] = useState(0);
  const d = (420/speed).toFixed(0)+'ms';
  const go = () => { setI(v=>(v+1)%players.length); replay(); };
  return (
    <div className="card-stage" onClick={go}>
      {key>0 && <div key={key} style={{textAlign:'center',zIndex:2}}>
        <div className="ft ft-sm a-scalePunch" style={{color:'var(--muted)',animationDuration:d}}>AM ZUG</div>
        <div className="ft ft-lg a-scalePunch" style={{color:'var(--text)',animationDuration:d,animationDelay:'60ms',opacity:0,animationFillMode:'forwards'}}>{players[i]}</div>
      </div>}
      {key===0 && <div style={{color:'var(--muted)',fontSize:12,fontFamily:'Space Mono'}}>↺ klicken</div>}
      <div className="play-hint">↺ klicken · Spieler wechselt</div>
    </div>
  );
}

/* ── CODES ── */
const C = {
spielGestartet: `<span class="cc">// SpielGestartet { tischId }</span>
scene.events.on(<span class="ce">'SpielGestartet'</span>, ({ tischId }) => {
  <span class="ck">const</span> t = <span class="ck">this</span>.<span class="cf">add</span>.<span class="cf">text</span>(cx, cy, <span class="cs">'SPIEL STARTET'</span>, style)
    .<span class="cf">setOrigin</span>(<span class="cs">0.5</span>).<span class="cf">setAlpha</span>(<span class="cn">0</span>);
  <span class="ck">this</span>.<span class="cf">tweens</span>.<span class="cf">add</span>({
    targets: t, x: cx, alpha: <span class="cn">1</span>,
    ease: <span class="cs">'Back.Out'</span>, duration: <span class="cn">400</span>,
    onComplete: () => <span class="ck">this</span>.<span class="cf">time</span>.<span class="cf">delayedCall</span>(<span class="cn">1500</span>, () => t.<span class="cf">destroy</span>())
  });
});`,
spielBeendet: `<span class="cc">// SpielBeendet { tischId, spielNummer, spielerDaten, partieBeendet }</span>
scene.events.on(<span class="ce">'SpielBeendet'</span>, ({ spielerDaten }) => {
  <span class="ck">const</span> gewinner = spielerDaten.<span class="cf">filter</span>(s => s.gewonnen);
  showFlashText(<span class="cs">'GEWONNEN'</span>, { scale: <span class="cn">4</span>, blur: <span class="cn">22</span> });
  emitter.<span class="cf">explode</span>(<span class="cn">60</span>, cx, cy);         <span class="cc">// Konfetti</span>
  <span class="ck">this</span>.<span class="cf">cameras</span>.main.<span class="cf">flash</span>(<span class="cn">300</span>, <span class="cn">100</span>,<span class="cn">255</span>,<span class="cn">100</span>);
});`,
stich: `<span class="cc">// StichAbgeschlossen { tischId }</span>
scene.events.on(<span class="ce">'StichAbgeschlossen'</span>, ({ punkte }) => {
  <span class="ck">const</span> t = <span class="ck">this</span>.<span class="cf">add</span>.<span class="cf">text</span>(cx, cy, <span class="cs">\`+\${punkte}\`</span>, style);
  <span class="ck">this</span>.<span class="cf">tweens</span>.<span class="cf">add</span>({
    targets: t,
    scaleX: [<span class="cn">0.65</span>, <span class="cn">1.1</span>, <span class="cn">1</span>],
    scaleY: [<span class="cn">0.65</span>, <span class="cn">1.1</span>, <span class="cn">1</span>],
    y: cy - <span class="cn">50</span>, alpha: { from: <span class="cn">0</span>, to: <span class="cn">1</span> },
    ease: <span class="cs">'Back.Out(2)'</span>, duration: <span class="cn">380</span>,
  });
});`,
vorbehalt: `<span class="cc">// VorbehaltErwartet { tischId }</span>
scene.events.on(<span class="ce">'VorbehaltErwartet'</span>, () => {
  <span class="ck">const</span> t = <span class="ck">this</span>.<span class="cf">add</span>.<span class="cf">text</span>(cx, cy, <span class="cs">'VORBEHALT?'</span>, style)
    .<span class="cf">setShadow</span>(<span class="cn">0</span>, <span class="cn">0</span>, <span class="cs">'#4488ff'</span>, <span class="cn">20</span>, <span class="cn">true</span>);
  <span class="ck">this</span>.<span class="cf">tweens</span>.<span class="cf">add</span>({
    targets: t, alpha: { from: <span class="cn">0.5</span>, to: <span class="cn">1</span> },
    yoyo: <span class="cn">true</span>, repeat: -<span class="cn">1</span>, duration: <span class="cn">700</span>
  });
});`,
schweinchen: `<span class="cc">// SchweinchenGemeldet { tischId, spielerPosition }</span>
scene.events.on(<span class="ce">'SchweinchenGemeldet'</span>, ({ spielerPosition }) => {
  <span class="ck">const</span> pos = getPositionOnScreen(spielerPosition);
  showPigBounce(pos);                    <span class="cc">// Back.Out, 650ms</span>
  spawnShockwaveRing(pos, <span class="cn">0xff88bb</span>);
  <span class="ck">this</span>.<span class="cf">cameras</span>.main.<span class="cf">shake</span>(<span class="cn">200</span>, <span class="cn">0.005</span>);
});`,
fuchs: `<span class="cc">// FuchsGefangen { tischId, taeter, opfer }</span>
scene.events.on(<span class="ce">'FuchsGefangen'</span>, ({ taeter, opfer }) => {
  <span class="cs">'FUCHS'</span>.<span class="cf">split</span>(<span class="cs">''</span>).<span class="cf">forEach</span>((ch, i) => {
    <span class="ck">const</span> l = <span class="ck">this</span>.<span class="cf">add</span>.<span class="cf">bitmapText</span>(
      startX + i*<span class="cn">58</span>, cy - <span class="cn">40</span>, <span class="cs">'font'</span>, ch
    ).<span class="cf">setAlpha</span>(<span class="cn">0</span>);
    <span class="ck">this</span>.<span class="cf">tweens</span>.<span class="cf">add</span>({
      targets: l, y: cy, alpha: <span class="cn">1</span>, angle: [-<span class="cn">18</span>, <span class="cn">0</span>],
      ease: <span class="cs">'Back.Out'</span>, delay: i * <span class="cn">75</span>, duration: <span class="cn">280</span>,
    });
  });
  emitter.<span class="cf">explode</span>(<span class="cn">30</span>, cx, cy);
});`,
karlchen: `<span class="cc">// KarlchenGespielt { tischId, taeter }</span>
scene.events.on(<span class="ce">'KarlchenGespielt'</span>, ({ taeter }) => {
  <span class="ck">const</span> t = <span class="ck">this</span>.<span class="cf">add</span>.<span class="cf">text</span>(cx, cy, <span class="cs">'KARLCHEN'</span>, style)
    .<span class="cf">setScale</span>(<span class="cn">0</span>).<span class="cf">setAlpha</span>(<span class="cn">0</span>);
  <span class="ck">this</span>.<span class="cf">tweens</span>.<span class="cf">add</span>({
    targets: t,
    scaleX: [<span class="cn">0</span>, <span class="cn">1.2</span>, <span class="cn">0.93</span>, <span class="cn">1.05</span>, <span class="cn">1</span>],
    scaleY: [<span class="cn">0</span>, <span class="cn">1.2</span>, <span class="cn">0.93</span>, <span class="cn">1.05</span>, <span class="cn">1</span>],
    angle: [<span class="cn">20</span>, -<span class="cn">6</span>, <span class="cn">2</span>, -<span class="cn">1</span>, <span class="cn">0</span>],
    alpha: { from: <span class="cn">0</span>, to: <span class="cn">1</span> },
    ease: <span class="cs">'Back.Out'</span>, duration: <span class="cn">560</span>,
  });
  spawnShockwaveRing(cx, cy, <span class="cn">0xffd700</span>);
});`,
doppelkopf: `<span class="cc">// DoppelkopfGestochen { tischId, gewinner }</span>
scene.events.on(<span class="ce">'DoppelkopfGestochen'</span>, ({ gewinner }) => {
  <span class="ck">const</span> t = <span class="ck">this</span>.<span class="cf">add</span>.<span class="cf">text</span>(cx, cy, <span class="cs">'DOPPELKOPF'</span>, style)
    .<span class="cf">setScale</span>(<span class="cn">0.3</span>).<span class="cf">setAlpha</span>(<span class="cn">0</span>);
  <span class="ck">this</span>.<span class="cf">tweens</span>.<span class="cf">add</span>({
    targets: t,
    scaleX: <span class="cn">1</span>, scaleY: <span class="cn">1</span>, alpha: <span class="cn">1</span>,
    ease: <span class="cs">'Expo.Out'</span>, duration: <span class="cn">580</span>,
  });
  <span class="ck">this</span>.<span class="cf">cameras</span>.main.<span class="cf">flash</span>(<span class="cn">350</span>,<span class="cn">255</span>,<span class="cn">215</span>,<span class="cn">0</span>);
  emitter.<span class="cf">explode</span>(<span class="cn">50</span>, cx, cy);
});`,
naechster: `<span class="cc">// NaechsterSpielerErwartet { tischId }</span>
scene.events.on(<span class="ce">'NaechsterSpielerErwartet'</span>, () => {
  <span class="ck">const</span> name = getCurrentPlayerName();
  <span class="ck">const</span> t = <span class="ck">this</span>.<span class="cf">add</span>.<span class="cf">text</span>(cx, cy, name, style)
    .<span class="cf">setScale</span>(<span class="cn">0.05</span>).<span class="cf">setAlpha</span>(<span class="cn">0</span>);
  <span class="ck">this</span>.<span class="cf">tweens</span>.<span class="cf">add</span>({
    targets: t,
    scaleX: [<span class="cn">0.05</span>,<span class="cn">1.18</span>,<span class="cn">0.94</span>,<span class="cn">1</span>],
    scaleY: [<span class="cn">0.05</span>,<span class="cn">1.18</span>,<span class="cn">0.94</span>,<span class="cn">1</span>],
    alpha: { from: <span class="cn">0</span>, to: <span class="cn">1</span> },
    ease: <span class="cs">'Back.Out'</span>, duration: <span class="cn">420</span>,
  });
});`,
};

/* ── App ── */
function App() {
  const { useTweaks, TweaksPanel, TweakSection, TweakSlider } = window;
  const [tweaks, setTweak] = useTweaks(/*EDITMODE-BEGIN*/{"speed":1.0}/*EDITMODE-END*/);
  const s = tweaks.speed;

  return (
    <div style={{ minHeight:'100vh' }}>
      <TweaksPanel>
        <TweakSection label="Animationsgeschwindigkeit" />
        <TweakSlider label="Speed" id="speed" min={0.3} max={3} step={0.1} value={s} onChange={v=>setTweak('speed',v)} />
        <div style={{fontSize:10,color:'var(--muted)',fontFamily:'Space Mono',marginTop:4}}>
          {s<0.7?'Zeitlupe (Debug)':s>2?'Turbo':s>1.3?'Schnell':'Normal'}
        </div>
      </TweaksPanel>

      <header className="site-header">
        <div className="site-header-left">
          <h1>Doppelkopf · Flash Text</h1>
          <p>Alle Spiel-Events → Animationsvorschlag + Phaser 3 Tween-Code</p>
        </div>
        <span className="event-count">9 Events</span>
      </header>

      <div className="grid">

        <div className="section-label">Spielablauf</div>

        <Card eventName="SpielGestartet" title="Slide-In Banner" badge="Neu" badgeClass="cyan"
          desc="Kurzer Banner von links — signalisiert Rundenstart ohne zu viel Aufmerksamkeit zu beanspruchen."
          payload={[{field:'tischId',sample:'"tisch-01"'}]}
          stage={<StageSpielGestartet speed={s} />} code={C.spielGestartet} />

        <Card eventName="NaechsterSpielerErwartet" title="Scale Punch (gedämpft)" badge="Turn" badgeClass="blue"
          desc="Spielername erscheint per Scale-Punch. Dezent — kommt jede Runde, darf nicht überfordern."
          payload={[{field:'tischId'}]}
          stage={<StageNaechster speed={s} />} code={C.naechster} />

        <Card eventName="VorbehaltErwartet" title="Neon Blink" badge="Input" badgeClass="blue"
          desc="Pulsierender Neon-Text signalisiert, dass ein Spieler eine Entscheidung treffen muss."
          payload={[{field:'tischId'}]}
          stage={<StageVorbehalt speed={s} />} code={C.vorbehalt} />

        <Card eventName="StichAbgeschlossen" title="Score Fly-Up" badge="Stich" badgeClass="green"
          desc="Punkte-Wert springt aus dem Stich heraus — schnell, knackig, informativ."
          payload={[{field:'tischId'}]}
          stage={<StageStich speed={s} />} code={C.stich} />

        <div className="section-label">Sonderpunkte</div>

        <Card eventName="FuchsGefangen" title="Letter Drop + Konfetti" badge="Fuchs" badgeClass="fox"
          desc="Buchstabe für Buchstabe fällt mit Rotation — maximale Dramatik für das wichtigste Sonderereignis."
          payload={[{field:'taeter',sample:'"Spieler 2"'},{field:'opfer',sample:'"Spieler 4"'}]}
          stage={<StageFuchs speed={s} />} code={C.fuchs} />

        <Card eventName="KarlchenGespielt" title="Bounce-In + Shockwave" badge="Karlchen" badgeClass="gold"
          desc="Energetischer Bounce mit leichter Rotation — Karlchen im letzten Stich verdient seinen Moment."
          payload={[{field:'taeter',sample:'"Spieler 1"'}]}
          stage={<StageKarlchen speed={s} />} code={C.karlchen} />

        <Card eventName="SchweinchenGemeldet" title="Pig Wobble + Camera Shake" badge="Schweinchen" badgeClass="pink"
          desc="Übertriebener Wobble-Bounce — Schweinchen ist selten genug, um maximalen Spaß zu verdienen."
          payload={[{field:'spielerPosition',sample:'2'}]}
          stage={<StageSchweinchen speed={s} />} code={C.schweinchen} />

        <div className="section-label">Spielhöhepunkte</div>

        <Card eventName="DoppelkopfGestochen" title="Chroma Flash + Konfetti + Camera Flash" badge="DK!" badgeClass="gold"
          desc="Der stärkste Effekt — Chroma-Blur + Shockwave-Ring + Konfetti. Für den Namen des Spiels selbst."
          payload={[{field:'gewinner',sample:'"Spieler 3"'}]}
          stage={<StageDoppelkopf speed={s} />} code={C.doppelkopf} />

        <Card eventName="SpielBeendet" title="Zoom Blur In + Konfetti + Camera Flash" badge="Ende" badgeClass="green"
          desc="Episches Finish: Text zoomt heran, Konfetti explodiert, Kamera flasht grün — klarer Gewinner-Moment."
          payload={[{field:'spielNummer'},{field:'spielerDaten'},{field:'partieBeendet',sample:'false'}]}
          stage={<StageSpielBeendet speed={s} />} code={C.spielBeendet} />

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
