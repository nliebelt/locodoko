<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh; background: #120e1a; color: #ede0ff;
  font-family: 'DM Sans', sans-serif; overflow-x: hidden;
}
#root { min-height: 100vh; }

body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
  background-size: 32px 32px;
}

.hdr {
  position: relative; z-index: 10; padding: 24px 36px 20px;
  border-bottom: 3px solid #3d2860; background: #1c1428;
  display: flex; align-items: center; justify-content: space-between;
}
.hdr h1 { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #ffd700; text-shadow: 3px 3px 0 #7a5000; line-height: 1.6; }
.hdr p { font-size: 11px; color: #6a4a8a; margin-top: 6px; }
.hdr-tag { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #120e1a; background: #ffd700; padding: 6px 14px; border-radius: 4px; box-shadow: 3px 3px 0 #7a5000; }

.content { position: relative; z-index: 1; padding: 32px 36px; display: flex; flex-direction: column; gap: 40px; }

.section-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: #6a4a8a; margin-bottom: 16px;
  font-family: 'Press Start 2P', monospace;
}

/* Icon grid */
.icon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 3px; background: #3d2860;
  border: 3px solid #3d2860; border-radius: 8px; overflow: hidden;
}
.icon-cell {
  background: #120e1a; padding: 20px 12px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  cursor: pointer; transition: background 0.15s; position: relative;
}
.icon-cell:hover { background: #1c1428; }
.icon-cell:hover .copy-hint { opacity: 1; }
.icon-name { font-size: 10px; color: #6a4a8a; text-align: center; font-weight: 600; line-height: 1.4; }
.icon-key  { font-family: 'Press Start 2P', monospace; font-size: 7px; color: #3d2860; text-align: center; margin-top: 2px; }
.copy-hint {
  position: absolute; top: 6px; right: 8px;
  font-size: 9px; color: #33ffee; opacity: 0; transition: opacity 0.15s;
  font-weight: 700;
}
.copy-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1c1428; border: 2px solid #33ffee; color: #33ffee;
  font-family: 'Press Start 2P', monospace; font-size: 9px;
  padding: 10px 20px; border-radius: 6px;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  z-index: 999; pointer-events: none;
  animation: toastIn 0.2s ease-out;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Size preview row */
.size-row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.size-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.size-label { font-size: 10px; color: #6a4a8a; font-weight: 600; }

/* Export panel */
.export-panel {
  background: #1c1428; border: 3px solid #3d2860; border-radius: 8px;
  padding: 20px 24px;
}
.export-title { font-family: 'Press Start 2P', monospace; font-size: 9px; color: #33ffee; margin-bottom: 14px; }
.export-code {
  background: #0a0612; border: 2px solid #3d2860; border-radius: 4px;
  padding: 14px 16px; font-family: 'Press Start 2P', monospace;
  font-size: 8.5px; color: #9988cc; line-height: 1.9;
  overflow-x: auto; white-space: pre;
}
.btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.btn {
  font-family: 'Press Start 2P', monospace; font-size: 8px;
  padding: 10px 18px; border-radius: 4px; cursor: pointer;
  border: 2px solid; transition: transform 0.1s;
}
.btn:active { transform: translate(2px, 2px); }
.btn-cyan  { background: #33ffee; color: #120e1a; border-color: #006655; box-shadow: 3px 3px 0 #006655; }
.btn-gold  { background: #ffd700; color: #120e1a; border-color: #7a5000; box-shadow: 3px 3px 0 #7a5000; }
.btn-muted { background: #1c1428; color: #6a4a8a; border-color: #3d2860; box-shadow: 3px 3px 0 #0a0612; }

const GROUPS = ['Suits', 'Sonderkarten', 'Ansagen', 'Spielstatus', 'Flash Labels'];

/* ── SVG to data URL ── */
function svgToDataUrl(svgStr, color) {
  const colored = svgStr.replace(/currentColor/g, color);
  const encoded = encodeURIComponent(colored);
  return `data:image/svg+xml,${encoded}`;
}

/* ── Copy SVG to clipboard ── */
async function copySvg(svgStr, color, key) {
  const colored = svgStr.replace(/currentColor/g, color);
  try { await navigator.clipboard.writeText(colored); } catch(e) {}
  return key;
}

/* ── Phaser load snippet ── */
function phaserSnippet(key, color, svgStr) {
  const colored = svgStr.replace(/currentColor/g, color).replace(/\n\s*/g, ' ').trim();
  const dataUrl = `data:image/svg+xml,${encodeURIComponent(colored)}`;
  return `// Phaser 3 — SVG als Textur laden\nthis.load.svg('${key}', '${dataUrl}',\n  { width: 64, height: 64 });\n\n// Dann verwenden:\nthis.add.image(x, y, '${key}').setScale(2);`;
}

/* ── ICON CELL ── */
function IconCell({ icon, size, onCopy }) {
  const [copied, setCopied] = useState(false);
  const handleClick = async () => {
    await copySvg(icon.svg, icon.color, icon.key);
    setCopied(true);
    onCopy(icon.key);
    setTimeout(() => setCopied(false), 1500);
  };
  const imgSrc = svgToDataUrl(icon.svg, icon.color);
  return (
    <div className="icon-cell" onClick={handleClick} title={`Klicken = SVG kopieren`}>
      <span className="copy-hint">{copied ? '✓' : 'COPY'}</span>
      <img src={imgSrc} width={size} height={size} style={{ imageRendering: 'pixelated' }} alt={icon.label} />
      <div className="icon-name">{icon.label}</div>
      <div className="icon-key">{icon.key}</div>
    </div>
  );
}

    setTimeout(() => setToast(null), 2000);

        </div>
        <span className="hdr-tag">ICON LAB</span>
      </div>

      <div className="content">

        {/* All icons grouped */}
        {GROUPS.map(group => {

          return (
            <div key={group}>

                  <IconCell key={icon.key} icon={icon} size={size} onCopy={(k) => { handleCopy(k); setSelectedIcon(k); }} />
                ))}
              </div>
            </div>
          );
        })}

        {/* Size preview */}
        <div>
          <div className="section-title">Größenvergleich — alle Suits</div>
          <div className="size-row">
            {[16,24,32,48,64,96].map(s => (
              <div className="size-item" key={s}>
                <img src={svgToDataUrl(ICONS.herz.svg, ICONS.herz.color)} width={s} height={s} style={{ imageRendering: 'pixelated' }} alt="herz" />
                <div className="size-label">{s}px</div>
              </div>
            ))}
          </div>
        </div>

        {/* Export / Phaser snippet */}
        <div className="export-panel">
          <div className="export-title">PHASER 3 EXPORT</div>
          {selected ? (
            <>
              <div style={{ fontSize: 12, color: '#6a4a8a', marginBottom: 12, fontFamily: 'DM Sans' }}>
                Ausgewählt: <strong style={{ color: '#ede0ff' }}>{selected.label}</strong> — Key: <code style={{ color: '#33ffee', fontFamily: 'monospace' }}>{selected.key}</code>
              </div>
              <pre className="export-code">{phaserSnippet(selected.key, selected.color, selected.svg)}</pre>
            </>
          ) : (
            <div style={{ fontSize: 12, color: '#6a4a8a', fontFamily: 'DM Sans', padding: '8px 0' }}>
              Ein Icon anklicken → Phaser 3 Load-Snippet erscheint hier
            </div>
          )}
          <div className="btn-row">
            <button className="btn btn-cyan" onClick={() => {
              const allSvgs = Object.values(ICONS).map(i => {
                const colored = i.svg.replace(/currentColor/g, i.color);
                return `<!-- ${i.key} -->\n${colored}`;
              }).join('\n\n');
              navigator.clipboard.writeText(allSvgs).catch(()=>{});
              setToast('Alle SVGs kopiert!');
              setTimeout(() => setToast(null), 2000);
            }}>ALLE SVGs KOPIEREN</button>
            <button className="btn btn-gold" onClick={() => {
              const phaser = Object.values(ICONS).map(i => {
                const colored = i.svg.replace(/currentColor/g, i.color).replace(/\n\s*/g, ' ').trim();
                const url = `data:image/svg+xml,${encodeURIComponent(colored)}`;
                return `this.load.svg('${i.key}', '${url}', { width: 64, height: 64 });`;
              }).join('\n');
              navigator.clipboard.writeText(phaser).catch(()=>{});
              setToast('Phaser preload() kopiert!');
              setTimeout(() => setToast(null), 2000);
            }}>PHASER PRELOAD() KOPIEREN</button>
            <button className="btn btn-muted" onClick={() => {
              const manifest = JSON.stringify(
                Object.values(ICONS).reduce((acc, i) => ({ ...acc, [i.key]: { label: i.label, group: i.group, color: i.color } }), {}),
                null, 2
              );
              navigator.clipboard.writeText(manifest).catch(()=>{});
              setToast('JSON Manifest kopiert!');
              setTimeout(() => setToast(null), 2000);
            }}>JSON MANIFEST</button>
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
