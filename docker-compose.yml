services:
  # --- Entwicklungsumgebung (Agent-Container) ---
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: locodoko-agent:latest
    container_name: locodoko-agent
    hostname: locodoko-agent

    # Keep the container running even without an active terminal session
    stdin_open: true
    tty: true

    # Mount the local workspace into the container so the agent can read/write
    # files that are also accessible from the host (e.g., your IDE).
    volumes:
      - .:/home/agent/workspace
      # Mount git config and SSH keys from the host so git operations work
      # immediately without additional setup inside the container.
      - ~/.gitconfig:/home/agent/.gitconfig:ro
      - ~/.ssh:/home/agent/.ssh:ro

    environment:
      # Provide a GitHub token so gh CLI works without interactive auth.
      # Copy .env.example to .env and fill in your token.
      - GH_TOKEN=${GH_TOKEN:-}
      # Chromium needs these flags inside Docker (set in Dockerfile as well,
      # but repeated here for visibility and easy override).
      - CHROMIUM_FLAGS=--no-sandbox --disable-dev-shm-usage

    # SYS_ADMIN capability and a relaxed seccomp profile are required for
    # Chromium's kernel namespace sandbox. Without these, headless Chrome
    # crashes at startup even with --no-sandbox.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

    # Expose a port if the agent runs a local HTTP server or API.
    ports:
      - "8081:8081"
      - "5173:5173"

  # --- PostgreSQL-Datenbank (Produktion + lokale Prod-Tests) ---
  postgres:
    image: postgres:17-alpine
    container_name: locodoko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: locodoko
      POSTGRES_USER: ${LOCODOKO_DB_USERNAME:-locodoko}
      POSTGRES_PASSWORD: ${LOCODOKO_DB_PASSWORD:-locodoko}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locodoko"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Locodoko-App (Produktion) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: locodoko-app:latest
    container_name: locodoko-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOCODOKO_DB_URL: jdbc:postgresql://postgres:5432/locodoko
      LOCODOKO_DB_USERNAME: ${LOCODOKO_DB_USERNAME:-locodoko}
      LOCODOKO_DB_PASSWORD: ${LOCODOKO_DB_PASSWORD:-locodoko}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-produktion}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_ABSENDER: ${MAIL_ABSENDER:-noreply@locodoko.de}
      APP_BASIS_URL: ${APP_BASIS_URL:-http://localhost:8081}
    volumes:
      # Strukturierte JSON-Logs teilen, damit der Alloy-Sidecar sie an Loki schicken kann.
      - applogs:/app/logs
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    profiles:
      - prod

  # --- Grafana Alloy: Metriken (/actuator/prometheus) + Logs (Loki) an Grafana Cloud ---
  # OPS-GRAFANA-MONITORING / OPS-LOGS-LOKI. Tokens/URLs via ENV (siehe .env.example), nie im Repo.
  alloy:
    image: grafana/alloy:latest
    container_name: locodoko-alloy
    restart: unless-stopped
    depends_on:
      - app
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - applogs:/logs:ro
    environment:
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    profiles:
      - prod

volumes:
  pgdata:
  applogs:
