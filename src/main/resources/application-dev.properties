spring.datasource.url=jdbc:h2:mem:locodoko;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.web.resources.static-locations=file:frontend/dist/,classpath:/static/
# CORS fuer WebSocket: im Development alle Urspruenge erlauben
locodoko.websocket.allowed-origins=*
# KI-Orchestrierung auf DEBUG fuer Entwicklung
logging.level.de.locodoko.tisch.KiOrchestrierungService=DEBUG
logging.level.de.locodoko.tisch.TischEchtzeitService=DEBUG
