spring.application.name=locodoko
server.port=8081
spring.profiles.default=dev
server.error.include-message=always
server.error.include-binding-errors=always
locodoko.session.timeout=${LOCODOKO_SESSION_TIMEOUT:60m}
locodoko.verbindung.reconnect-timeout-sekunden=${LOCODOKO_RECONNECT_TIMEOUT_SEKUNDEN:120}
locodoko.verbindung.pruefreconnect-ms=${LOCODOKO_PRUEFRECONNECT_MS:10000}
server.servlet.session.timeout=${LOCODOKO_SESSION_TIMEOUT:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
logging.level.de.locodoko=INFO
logging.structured.format.file=ecs
logging.file.name=logs/locodoko.log
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=simple
# Micrometer: gemeinsames Label "application" für alle Metriken (Grafana-Filter).
management.metrics.tags.application=locodoko
management.prometheus.metrics.export.enabled=true
# Bugreport — GitHub-Issue-Anlage env-gated. Ohne Token/Repo: nur Logging, kein GitHub-Call.
locodoko.bugreport.github-token=${LOCODOKO_BUGREPORT_GITHUB_TOKEN:}
locodoko.bugreport.github-repo=${LOCODOKO_BUGREPORT_GITHUB_REPO:}
locodoko.bugreport.loki-base-url=${LOCODOKO_BUGREPORT_LOKI_BASE_URL:}
# Sentry — Fehlererfassung. DSN kommt aus der Umgebung; ohne DSN ist Sentry deaktiviert (No-Op).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:lokal}
# OAuth2 Google — Credentials kommen aus Umgebungsvariablen, nie aus dem Repository.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Mail / SMTP — Email-Verifizierung und Passwort-Reset (V2).
# Ohne SMTP_HOST (oder spring.mail.host) sind alle MailService-Aktionen No-Ops.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
locodoko.mail.absender=${MAIL_ABSENDER:noreply@locodoko.de}
locodoko.mail.basis-url=${APP_BASIS_URL:http://localhost:8081}
management.health.mail.enabled=false
