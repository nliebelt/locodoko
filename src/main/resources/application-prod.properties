spring.datasource.url=${LOCODOKO_DB_URL:jdbc:postgresql://localhost:5432/locodoko}
spring.datasource.username=${LOCODOKO_DB_USERNAME:locodoko}
spring.datasource.password=${LOCODOKO_DB_PASSWORD:locodoko}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
server.servlet.session.cookie.secure=true

# CORS fuer WebSocket: im Produktionsbetrieb auf die eigene Domain beschraenken
locodoko.websocket.allowed-origins=${LOCODOKO_WEBSOCKET_ALLOWED_ORIGINS:https://zock.locodoko.de}
server.servlet.session.cookie.domain=zock.locodoko.de

# S1: Forward-Header-Strategie fuer Reverse-Proxy (Caddy) – korrekte Client-IP via X-Forwarded-For
server.forward-headers-strategy=framework

# S4: Keine internen Fehlermeldungen in HTTP-Antworten leaken
server.error.include-message=never
server.error.include-binding-errors=never
