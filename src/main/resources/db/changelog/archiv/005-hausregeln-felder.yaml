databaseChangeLog:
  - changeSet:
      id: 005-hausregeln-felder
      author: locodoko
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: tisch
                columnName: bockrunden_aktiv
      changes:
        - addColumn:
            tableName: tisch
            columns:
              - column:
                  name: bockrunden_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: schweinchen_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: dreissig_augen_pflicht_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
