                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: gegen_die_alten_punkte
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: solo_multiplikator
                  type: INT
                  constraints:
                    nullable: true
