databaseChangeLog:
  - changeSet:
      id: 009-solist-position
      author: locodoko
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: partie
                columnName: solist_des_letzten_spiels
      changes:
        - addColumn:
            tableName: partie
            columns:
              - column:
                  name: solist_des_letzten_spiels
                  type: VARCHAR(10)
                  constraints:
                    nullable: true
