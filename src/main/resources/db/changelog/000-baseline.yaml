                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: reihenfolge
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        # --- spiel_sonderpunkt ---
        - createTable:
            tableName: spiel_sonderpunkt
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: spiel_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sonderpunkt_spiel
                    references: spiel(id)
                    deleteCascade: true
              - column:
                  name: partei
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: sonderpunkt
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: spiel_key
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
