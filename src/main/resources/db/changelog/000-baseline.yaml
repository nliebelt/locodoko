databaseChangeLog:
  - changeSet:
      id: 000-baseline
      author: locodoko
      comment: >
        Konsolidiertes Schema (ersetzt 001–009 fuer Frisch-Deployments).
        Existierende Datenbanken ueberspringen dieses Changeset automatisch.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: tisch
      changes:
        # --- spieler ---
        - createTable:
            tableName: spieler
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: true
              - column:
                  name: ki
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: ki_uebernommen
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        # --- partie ---
        - createTable:
            tableName: partie
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: anzahl_spiele
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: aktuelles_spiel_nummer
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: punkte_sued
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: punkte_west
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: punkte_nord
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: punkte_ost
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: bockrunden_zaehler
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: solist_des_letzten_spiels
                  type: VARCHAR(10)
                  constraints:
                    nullable: true

        # --- tisch ---
        - createTable:
            tableName: tisch
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_von_spieler_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tisch_erstellt_von
                    references: spieler(id)
              - column:
                  name: partie_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: ohne_neunen
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: anzahl_spiele
                  type: INT
                  defaultValueNumeric: 24
                  constraints:
                    nullable: false
              - column:
                  name: tischhintergrund
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: hochzeit_erlaubt
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: armut_erlaubt
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: damensolo_erlaubt
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: bubensolo_erlaubt
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: fleischlos_erlaubt
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: trumpfsolo_erlaubt
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: zweite_dulle_sticht
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: fuchs_gefangen_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: karlchen_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: doppelkopf_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: mindestkarten_re_kontra
                  type: INT
                  defaultValueNumeric: 11
                  constraints:
                    nullable: false
              - column:
                  name: mindestkarten_keine90
                  type: INT
                  defaultValueNumeric: 10
                  constraints:
                    nullable: false
              - column:
                  name: mindestkarten_keine60
                  type: INT
                  defaultValueNumeric: 9
                  constraints:
                    nullable: false
              - column:
                  name: mindestkarten_keine30
                  type: INT
                  defaultValueNumeric: 8
                  constraints:
                    nullable: false
              - column:
                  name: mindestkarten_schwarz
                  type: INT
                  defaultValueNumeric: 7
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: ki_schwierigkeit
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: STANDARD
              - column:
                  name: bockrunden_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: schweinchen_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: dreissig_augen_pflicht_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: schmeissen_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: herz_durchgegangen_nur_hoch
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        # --- tisch_spieler ---
        - createTable:
            tableName: tisch_spieler
            columns:
              - column:
                  name: tisch_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tisch_spieler_tisch
                    references: tisch(id)
                    deleteCascade: true
              - column:
                  name: spieler_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tisch_spieler_spieler
                    references: spieler(id)
              - column:
                  name: tisch_spieler_key
                  type: INT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: tisch_spieler
            columnNames: tisch_id, spieler_id

        # --- spiel ---
        - createTable:
            tableName: spiel
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: partie_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_spiel_partie
                    references: partie(id)
                    deleteCascade: true
              - column:
                  name: spiel_nummer
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: geber_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: spieltyp
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: phase
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: vorbehalte
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: ansagen
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: aktueller_stich_karten
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: aktueller_stich_aufspieler_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: armut_spieler_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: armut_aktueller_antwort_index
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: armut_angebot_abgegeben
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: armut_partner_spieler_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: armut_angebotene_karten
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: hochzeit_spieler_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: hochzeit_geklaerte_stiche
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: hochzeit_partner_spieler_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: hochzeit_stilles_solo
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: re_augen
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: kontra_augen
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: sieger_partei
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: spielwert
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: spielpunkte_sued
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: spielpunkte_west
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: spielpunkte_nord
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: spielpunkte_ost
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: grundwert
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: absage_punkte
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: gegen_die_alten_punkte
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: solo_multiplikator
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: pflicht_ansage_ausstehend
                  type: VARCHAR(255)
                  defaultValue: '[]'
                  constraints:
                    nullable: false
              - column:
                  name: schweinchen_aktiv
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        # --- hand (wird spaeter von 012 gedroppt, aber fuer inkrementelle Migration noetig) ---
        - createTable:
            tableName: hand
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: spiel_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_hand_spiel
                    references: spiel(id)
                    deleteCascade: true
              - column:
                  name: spieler_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: karten
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        # --- stich (wird spaeter von 012 gedroppt) ---
        - createTable:
            tableName: stich
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: spiel_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_stich_spiel
                    references: spiel(id)
                    deleteCascade: true
              - column:
                  name: stich_nummer
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: stich_key
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: aufspieler_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: gewinner_position
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: augen
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: erstellt_am
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: aktualisiert_am
