# Test-Override: Jeder Spring-Testkontext bekommt eine eigene H2-In-Memory-Datenbank,
# um Liquibase-Konflikte zwischen verschiedenen @SpringBootTest-Konfigurationen zu vermeiden.
# ${random.value} wird einmal pro ApplicationContext ausgewertet (durch RandomValuePropertySource),
# sodass gecachte Kontexte dieselbe DB nutzen, unterschiedliche Kontexte (NONE vs RANDOM_PORT)
# aber jeweils eine eigene DB mit eigenem Liquibase-Lauf erhalten.
spring.datasource.url=jdbc:h2:mem:locodoko_${random.value};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.liquibase.drop-first=false
