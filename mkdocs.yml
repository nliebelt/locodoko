site_name: Locodoko Dokumentation
site_url: https://docs.locodoko.de
repo_url: https://github.com/nliebelt/locodoko
repo_name: nliebelt/locodoko
docs_dir: docs
site_dir: site
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Hellmodus wechseln
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Dunkelmodus wechseln
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: de

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nliebelt/locodoko

